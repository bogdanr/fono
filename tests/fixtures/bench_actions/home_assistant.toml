# SPDX-License-Identifier: GPL-3.0-only
#
# Spoken commands against a real home.
#
# No device is named anywhere in this file, and none ever should be. Each case
# states what it needs — "any light", "an area with a light and something else
# switchable in it" — and the name is filled in from whatever home the suite is
# pointed at. That is what makes this file safe to commit, and it is also what
# makes it somebody else's benchmark rather than one person's script: clone the
# repository, point it at your own home, and every case either runs or reports
# that your home has nothing to run it against.
#
# The cases are not a tour of the happy path. Each one is a failure that has
# actually been observed, written down so it cannot come back unnoticed.

suite_version = 5
server = "Home Assistant"

# ---------------------------------------------------------------------------
# The ordinary case. If this fails nothing else is worth reading.
# ---------------------------------------------------------------------------
[[cases]]
id = "switch_one_light_on"
class = "plain_command"
requires = { kind = "device", domain = "light" }
precondition = "off"
expect_device = "on"
expect_tool = "HassTurnOn"

[cases.utterances]
en = "turn on the {device}"
ro = "aprinde {device}"
fr = "allume {device}"
es = "enciende {device}"

[[cases]]
id = "switch_one_light_off"
class = "plain_command"
requires = { kind = "device", domain = "light" }
precondition = "on"
expect_device = "off"
expect_tool = "HassTurnOff"

[cases.utterances]
en = "turn off the {device}"
ro = "stinge {device}"
fr = "éteins {device}"
es = "apaga {device}"

# ---------------------------------------------------------------------------
# The area command, and the reason this harness watches the house rather than
# the tool call.
#
# Asked in Romanian to turn on *the light* in an area, a model asked for the
# whole area instead. That is a perfectly well-formed call — an area-wide
# switch-on is a real thing to want — and inspecting it finds nothing wrong.
# What was wrong only showed up in the house: the air conditioning came on.
#
# So this case is scored twice over. The call must carry the kind of device
# that was asked for, and the other switchable thing in that area must still be
# where it was. The second assertion is the one that catches it.
# ---------------------------------------------------------------------------
[[cases]]
id = "area_command_names_the_kind_of_device"
class = "area_command"
requires = { kind = "area_with_bystander", domain = "light" }
expect_device = "on"
expect_bystander_unchanged = true
expect_args = { domain = ["light"] }

[cases.utterances]
en = "turn on the lights in the {area}"
ro = "aprinde lumina în {area}"
fr = "allume la lumière dans {area}"
es = "enciende la luz en {area}"

# ---------------------------------------------------------------------------
# The same room, asked about the kind of device that is not the lights.
#
# Asked to switch on the air conditioning in a room, a model reached for the
# set-a-temperature tool with no temperature in it; handed that back and told
# to use a plain switch instead, it aimed the switch at the room, and every
# light in the room came on. Both calls were well-formed, and the only witness
# was the house.
#
# So the assertion is on the bystander. The case deliberately says nothing
# about what state the climate device ends in: a home may refuse a plain
# switch on a thermostat outright, which is a fact about that home and not the
# failure being measured. Nothing is staged either, so a home that answers
# strangely cannot leave the rest of the run standing in the wrong state.
# ---------------------------------------------------------------------------
[[cases]]
id = "a_kind_in_an_area_reaches_only_that_kind"
class = "area_command"
requires = { kind = "area_with_bystander", domain = "climate" }
expect_bystander_unchanged = true
expect_tool = "HassTurnOn"

[cases.utterances]
en = "turn on the air conditioning in the {area}"
ro = "pornește aerul condiționat din {area}"
fr = "allume la climatisation dans {area}"
es = "enciende el aire acondicionado en {area}"

# ---------------------------------------------------------------------------
# A value nobody asked for.
#
# The brightness field exists, so a model fills it in — and a lamp that was
# asked to come on comes on at forty percent. The switch-on is correct; the
# extra argument is the defect, and only a forbidden-argument check sees it.
# ---------------------------------------------------------------------------
[[cases]]
id = "plain_switch_on_invents_no_brightness"
class = "invented_argument"
requires = { kind = "adjustable_device", domain = "light" }
precondition = "off"
expect_device = "on"
expect_tool = "HassTurnOn"
forbid_args = ["brightness", "brightness_pct", "color", "color_temp"]

[cases.utterances]
en = "turn on the {device}"
ro = "aprinde {device}"
fr = "allume {device}"
es = "enciende {device}"

# ---------------------------------------------------------------------------
# Choosing between two tools that look almost the same.
#
# Dimming and switching on are different tools with near-identical
# descriptions, and a model that reaches for the dimmer when asked to dim is
# doing the easy half. The point of pinning the tool name here is that a
# switch-on to full brightness would satisfy the user and hide the confusion.
# ---------------------------------------------------------------------------
[[cases]]
id = "dim_uses_the_brightness_tool"
class = "tool_choice"
requires = { kind = "adjustable_device", domain = "light" }
precondition = "on"
expect_device = "on"
expect_tool = "HassLightSet"
# And the lamp has to be at thirty afterwards. Every language below spells the
# number out in words rather than digits, which is the case that catches a
# harness — Fono's or anyone's — refusing a number because no digit was typed.
# Speech is where these commands come from, and speech has no digits.
expect_level = 30

[cases.utterances]
en = "set the {device} to thirty percent"
ro = "pune {device} la treizeci la sută"
fr = "règle {device} à trente pour cent"
es = "pon {device} al treinta por ciento"

# ---------------------------------------------------------------------------
# A command that must never be repeated.
#
# The retry ladder is right about almost everything and dangerously wrong here:
# asking twice for two degrees warmer is four degrees warmer. A second call is
# the failure, whatever the server said about the first.
#
# The device is named rather than the area, because a thermostat is not
# guaranteed to be filed under an area and a command addressed to nowhere
# would fail for a reason that has nothing to do with repetition.
# ---------------------------------------------------------------------------
[[cases]]
id = "relative_change_is_never_repeated"
class = "non_idempotent"
requires = { kind = "device", domain = "climate" }
retry_allowed = false

[cases.utterances]
en = "make the {device} two degrees warmer"
ro = "fă {device} cu două grade mai cald"
fr = "monte {device} de deux degrés"
es = "sube {device} dos grados"

# ---------------------------------------------------------------------------
# Requests that must leave the house exactly as they found it.
#
# Without these a benchmark rewards a model for being trigger-happy, and the
# fastest way to a perfect score is to act on everything. A question about the
# house is a question; an impossible request deserves a plain no. Looking the
# answer up is allowed — that is how a question about state gets answered.
# ---------------------------------------------------------------------------
[[cases]]
id = "a_question_about_state_is_answered_not_acted_on"
class = "must_not_act"
requires = { kind = "device", domain = "light" }
expect_no_change = true

[cases.utterances]
en = "is the {device} on at the moment?"
ro = "e aprinsă {device} acum?"
fr = "est-ce que {device} est allumée en ce moment ?"
es = "¿está encendida {device} ahora?"

[[cases]]
id = "an_impossible_request_is_refused_plainly"
class = "must_not_act"
requires = { kind = "device", domain = "light" }
expect_no_change = true

[cases.utterances]
en = "paint the {device} blue and move it to the other room"
ro = "vopsește {device} în albastru și mut-o în cealaltă cameră"
fr = "peins {device} en bleu et déplace-la dans l'autre pièce"
es = "pinta {device} de azul y muévela a la otra habitación"

# ---------------------------------------------------------------------------
# Switching something on that is not a light.
#
# Every case above this point is about lamps, which flatters a model: `light`
# is the domain with the most training data behind it and the most obvious
# vocabulary. An air conditioner is the same request in a domain that shares
# almost none of that — and the tool is still the plain switch-on, not one of
# the climate tools, which is the confusion worth measuring.
#
# Scored loosely on the resulting state on purpose: a climate device answers
# with the mode it started in (`cool`, `heat`, `auto`, …) and never with `on`,
# so pinning a mode here would be a fixture about one house's weather.
# ---------------------------------------------------------------------------
[[cases]]
id = "switch_a_climate_device_on"
class = "plain_command"
requires = { kind = "device", domain = "climate" }
precondition = "off"
expect_device = "on"
expect_tool = "HassTurnOn"
# Nobody said how warm. The temperature field is one tool away and a model
# that reaches for it has changed the request into a different one.
forbid_args = ["temperature"]

[cases.utterances]
en = "turn on the {device}"
ro = "pornește {device}"
fr = "allume {device}"
es = "enciende {device}"

[[cases]]
id = "switch_a_climate_device_off"
class = "plain_command"
requires = { kind = "device", domain = "climate" }
precondition = "on"
expect_device = "off"
expect_tool = "HassTurnOff"

[cases.utterances]
en = "turn off the {device}"
ro = "oprește {device}"
fr = "éteins {device}"
es = "apaga {device}"

# ---------------------------------------------------------------------------
# A number that is a destination, not a distance.
#
# Two volume tools sit side by side — one sets a level, the other nudges it —
# and "set the volume to seventy" names a level. Reaching for the relative tool
# gives a speaker seventy percent *louder* than it already was: the number is
# right, the meaning is wrong, and nothing outside the tool name shows it.
#
# This is the same shape as the two-degrees-warmer case above, arrived at from
# the opposite side: there the danger is repeating a relative command, here it
# is treating an absolute one as relative in the first place.
#
# A second call is *not* forbidden here, unlike that case. Setting a level to
# seventy twice lands on seventy, so if the model opens with the relative tool
# and then corrects itself the ladder has genuinely repaired the damage — which
# is worth recording as a recovery rather than punishing as a repeat.
# ---------------------------------------------------------------------------
[[cases]]
id = "an_absolute_level_is_not_a_relative_change"
class = "tool_choice"
requires = { kind = "device", domain = "media_player" }
expect_tool = "HassSetVolume"
expect_args = { volume_level = 70 }
# And the speaker has to actually be at seventy afterwards. Without this the
# case passes on a call the server refused: right tool, right argument, nobody
# checked whether it landed.
expect_level = 70

[cases.utterances]
en = "set the volume to seventy on the {device}"
ro = "setează volumul la 70 pe {device}"
fr = "règle le volume à soixante-dix sur {device}"
es = "pon el volumen a setenta en {device}"

# ---------------------------------------------------------------------------
# A blind, which is neither on nor off.
#
# Every case above this point acts on something that reports `on` or `off`. A
# cover reports `open` and `closed`, and there is no `HassOpenCover` — the same
# two switch intents move it. So this is the plain switch-on wearing different
# words, and a model that has learnt "on means HassTurnOn" rather than "the
# user wants this thing running" fails it.
#
# It is also the only case where the harness itself has to know that a state it
# has never seen is still a state it can put back.
# ---------------------------------------------------------------------------
[[cases]]
id = "open_a_cover"
class = "plain_command"
requires = { kind = "device", domain = "cover" }
precondition = "closed"
expect_device = "open"
expect_tool = "HassTurnOn"
# Nobody said how far. A position is one tool away, and a blind asked to open
# that stops at forty percent has answered a request nobody made.
forbid_args = ["position"]

[cases.utterances]
en = "open the {device}"
ro = "deschide {device}"
fr = "ouvre {device}"
es = "abre {device}"

# ---------------------------------------------------------------------------
# A blind asked to go half way.
#
# `HassSetPosition` is enabled in every house that owns a blind, publishes its
# bounds honestly, and has never been called by Fono. It is also the only value
# case that cannot be skipped for want of a device: a lamp reports its
# brightness only while it is lit, and a speaker only after something has
# played, but a blind reports how far open it is whatever it is doing.
#
# The number is asserted against the blind and not only against the call. A
# position that the server refused would otherwise score as a pass on the tool
# name alone, which is exactly how the dimming case used to pass while doing
# nothing.
# ---------------------------------------------------------------------------
[[cases]]
id = "set_a_cover_position_uses_the_position_tool"
class = "tool_choice"
requires = { kind = "adjustable_device", domain = "cover" }
precondition = "closed"
expect_tool = "HassSetPosition"
expect_args = { position = 50 }
expect_level = 50

[cases.utterances]
en = "set the {device} to 50 percent"
ro = "pune {device} la 50 la sută"
fr = "règle {device} à 50 pour cent"
es = "pon {device} al 50 por ciento"

# ---------------------------------------------------------------------------
# A name the home does not have.
#
# The worst failure short of an outright lie: asked for something that is not
# there, a model quietly does it to the nearest thing that is. Nothing in the
# call looks wrong — the tool is right, the arguments are well-formed, the
# server accepts it — and a device nobody mentioned changes state.
#
# Scored entirely on the house. The right answer is to say the home has no such
# thing; looking it up first is allowed, acting is not.
#
# Skips on a home that turns out to own something by this name, which is why
# the name is deliberately absurd rather than merely unlikely.
# ---------------------------------------------------------------------------
[[cases]]
id = "an_unknown_device_is_refused"
class = "must_not_act"
requires = { kind = "no_such_device", name = "pizza oven" }
expect_no_change = true

[cases.utterances]
en = "turn on the pizza oven"
ro = "pornește cuptorul de pizza"
fr = "allume le four à pizza"
es = "enciende el horno de pizza"

# ---------------------------------------------------------------------------
# An area with several devices in it, where every one of them has to arrive.
#
# The area case above resolves onto whatever area has a light and a bystander,
# which may be an area with exactly one lamp — and there "they all came on" and
# "it came on" are the same sentence. Insisting on several exercises the parts
# that only exist because one command reaches many devices: every member having
# to land, and the reading of the home afterwards having to report on a dozen
# devices without reciting a dozen names at the model.
# ---------------------------------------------------------------------------
[[cases]]
id = "an_area_of_several_lights_all_arrive"
class = "area_command"
requires = { kind = "area_with_several", domain = "light", at_least = 3 }
precondition = "off"
expect_device = "on"
expect_args = { domain = ["light"] }

[cases.utterances]
en = "turn on all the lights in the {area}"
ro = "aprinde toate luminile din {area}"
fr = "allume toutes les lumières dans {area}"
es = "enciende todas las luces en {area}"

# ---------------------------------------------------------------------------
# Aiming an air conditioner at a temperature.
#
# The mirror image of the switch-on case above, and the one command where the
# temperature field is the request rather than an invention. A suite that only
# ever forbids that field teaches nothing about whether the model can still
# reach for it when it is asked to — and the fix for the invented value is
# exactly the kind of fix that could break this.
#
# The number is not asserted against the device, only against the call: houses
# disagree about degrees, a device clamps to its own limits, and a fixture that
# demanded the thermostat read back twenty-three would be a fixture about one
# air conditioner. What matters is that the number the user said reached the
# call intact.
# ---------------------------------------------------------------------------
[[cases]]
id = "set_a_temperature_uses_the_climate_tool"
class = "tool_choice"
requires = { kind = "adjustable_device", domain = "climate" }
precondition = "on"
expect_tool = "HassClimateSetTemperature"
expect_args = { temperature = 23 }

[cases.utterances]
en = "set the {device} to twenty-three degrees"
ro = "pune {device} la 23 de grade"
fr = "règle {device} à vingt-trois degrés"
es = "pon {device} a veintitrés grados"
